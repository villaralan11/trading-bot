name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas flake8 black isort
          
      - name: Lint with flake8
        run: |
          flake8 bot_dca/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 bot_dca/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
          
      - name: Check formatting with black
        run: |
          black --check --diff bot_dca/
          
      - name: Check imports with isort
        run: |
          isort --check-only --diff bot_dca/
          
      - name: Test imports
        run: |
          cd bot_dca
          python -c "import bot_dca; print('Import OK')"